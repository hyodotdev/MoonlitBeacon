      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#e8ecf8"/>
      <stop offset="0.75" stop-color="#a8b0c8"/>
      <stop offset="1" stop-color="#6a7090"/>
    </linearGradient>
  </defs>
  <path d="M 12 8 H 36 L 47 19 V 29 L 36 40 H 12 L 1 29 V 19 Z" fill="#3c4058"/>
