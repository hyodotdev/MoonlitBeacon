<svg xmlns="http://www.w3.org/2000/svg" width="208" height="208" viewBox="0 0 208 208">
  <!-- Dash dial: a bronze instrument ring with moon ticks on deep ink. -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#070a1e" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#070a1e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#070a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b47a"/>
      <stop offset="0.5" stop-color="#8a6f4d"/>
      <stop offset="1" stop-color="#4a3a24"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1c2249"/>
      <stop offset="0.7" stop-color="#10142e"/>
      <stop offset="1" stop-color="#070a1e"/>
    </radialGradient>
  </defs>
  <circle cx="104" cy="104" r="102" fill="url(#halo)"/>
  <circle cx="104" cy="104" r="96" fill="none" stroke="#241c0e" stroke-width="17" opacity="0.3"/>
  <circle cx="104" cy="104" r="96" fill="none" stroke="url(#bronze)" stroke-width="13"/>
  <circle cx="104" cy="104" r="86" fill="url(#well)"/>
  <circle cx="104" cy="104" r="86" fill="none" stroke="#171106" stroke-width="3"/>
  <circle cx="104" cy="104" r="62" fill="none" stroke="#3d6b74" stroke-width="2.4" opacity="0.9"/>
  <g stroke-linecap="round">
    <line x1="104" y1="30" x2="104" y2="44" stroke="#8fd8d2" stroke-width="6"/>
    <line x1="104" y1="164" x2="104" y2="178" stroke="#8fd8d2" stroke-width="6"/>
    <line x1="30" y1="104" x2="44" y2="104" stroke="#8fd8d2" stroke-width="6"/>
    <line x1="164" y1="104" x2="178" y2="104" stroke="#8fd8d2" stroke-width="6"/>
    <line x1="52" y1="52" x2="62" y2="62" stroke="#3d6b74" stroke-width="5"/>
    <line x1="146" y1="146" x2="156" y2="156" stroke="#3d6b74" stroke-width="5"/>
    <line x1="156" y1="52" x2="146" y2="62" stroke="#3d6b74" stroke-width="5"/>
    <line x1="62" y1="146" x2="52" y2="156" stroke="#3d6b74" stroke-width="5"/>
